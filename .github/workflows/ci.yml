name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax
        run: |
          node --check server.js
          node -e "const fs = require('fs'), cp = require('child_process'); ['modules', 'api'].forEach(d => { if (fs.existsSync(d)) fs.readdirSync(d).filter(f => f.endsWith('.js')).forEach(f => cp.execSync('node --check ' + d + '/' + f, { stdio: 'inherit' })); });"

      - name: Run unit & integration tests
        run: npm test -- --testPathIgnorePatterns="api\.test\.js|e2e\.spec\.js"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  docs-build:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sphinx & plugins
        run: |
          python -m pip install --upgrade pip
          pip install sphinx myst-parser sphinx_rtd_theme

      - name: Build HTML documentation
        run: python -m sphinx.cmd.build -W -b html docs/source docs/build/html
